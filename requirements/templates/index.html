<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Email Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 800px; margin-top: 50px; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .result { margin-top: 20px; }
        .confidence-bar { height: 20px; background-color: #e9ecef; border-radius: 10px; overflow: hidden; }
        .confidence-fill { height: 100%; transition: width 0.5s; }
        .phishing { background-color: #dc3545; }
        .not-phishing { background-color: #28a745; }
        .batch-result { margin-bottom: 10px; padding: 10px; border-radius: 5px; }
        .batch-phishing { background-color: #f8d7da; border: 1px solid #f5c6cb; }
        .batch-not-phishing { background-color: #d1edff; border: 1px solid #bee5eb; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .export-btn { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h1 class="card-title mb-0">Phishing Email Detector</h1>
            </div>
            <div class="card-body">
                <ul class="nav nav-tabs" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="single-tab" data-bs-toggle="tab" data-bs-target="#single" type="button" role="tab" aria-controls="single" aria-selected="true">Single Email</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="batch-tab" data-bs-toggle="tab" data-bs-target="#batch" type="button" role="tab" aria-controls="batch" aria-selected="false">Batch Analysis</button>
                    </li>
                </ul>
                <div class="tab-content" id="myTabContent">
                    <div class="tab-pane fade show active" id="single" role="tabpanel" aria-labelledby="single-tab">
                        <form id="emailForm" class="mt-3">
                            <div class="mb-3">
                                <label for="modelSelect" class="form-label">Select Model:</label>
                                <select class="form-select" id="modelSelect">
                                    <option value="best">Best Model</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="emailText" class="form-label">Enter Email Text:</label>
                                <textarea class="form-control" id="emailText" rows="5" placeholder="Paste your email content here..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Analyze Email</button>
                        </form>
                    </div>
                    <div class="tab-pane fade" id="batch" role="tabpanel" aria-labelledby="batch-tab">
                        <form id="batchForm" class="mt-3">
                            <div class="mb-3">
                                <label for="batchModelSelect" class="form-label">Select Model:</label>
                                <select class="form-select" id="batchModelSelect">
                                    <option value="best">Best Model</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="batchEmails" class="form-label">Enter Multiple Emails (one per line):</label>
                                <textarea class="form-control" id="batchEmails" rows="10" placeholder="Paste multiple emails here, one per line..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Analyze Batch</button>
                        </form>
                        <div id="batchResults" class="mt-3" style="display: none;">
                            <h4>Batch Results:</h4>
                            <div id="batchResultsList"></div>
                        </div>
                    </div>
                </div>
                <div id="result" class="result" style="display: none;">
                    <h3>Result:</h3>
                    <p id="prediction"></p>
                    <div class="confidence-bar">
                        <div id="confidenceFill" class="confidence-fill"></div>
                    </div>
                    <p id="confidenceText"></p>
                </div>
            </div>
        </div>
        <div class="card mt-4">
            <div class="card-header">
                <h5>Model Metrics & Visualizations</h5>
            </div>
            <div class="card-body">
                <button id="loadMetrics" class="btn btn-secondary">Load Metrics</button>
                <div id="metrics" style="display: none;">
                    <p><strong>Model:</strong> <span id="modelName"></span></p>
                    <p><strong>Accuracy:</strong> <span id="accuracy"></span></p>
                    <p><strong>Precision:</strong> <span id="precision"></span></p>
                    <p><strong>Recall:</strong> <span id="recall"></span></p>
                    <p><strong>F1 Score:</strong> <span id="f1"></span></p>
                    <p><strong>ROC AUC:</strong> <span id="rocAuc"></span></p>
                    <h6>Confusion Matrix:</h6>
                    <img id="confusionMatrix" src="" alt="Confusion Matrix" style="max-width: 100%; display: none;">
                    <h6>ROC Curve:</h6>
                    <img id="rocCurve" src="" alt="ROC Curve" style="max-width: 100%; display: none;">
                    <h6>Word Clouds:</h6>
                    <div class="row">
                        <div class="col-md-6">
                            <h6>Phishing Emails:</h6>
                            <img id="wordcloudPhishing" src="" alt="Phishing Word Cloud" style="max-width: 100%; display: none;">
                        </div>
                        <div class="col-md-6">
                            <h6>Non-Phishing Emails:</h6>
                            <img id="wordcloudNonPhishing" src="" alt="Non-Phishing Word Cloud" style="max-width: 100%; display: none;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load available models
        fetch('/models_list')
        .then(response => response.json())
        .then(data => {
            const models = data.models;
            const singleSelect = document.getElementById('modelSelect');
            const batchSelect = document.getElementById('batchModelSelect');
            models.forEach(model => {
                const option1 = document.createElement('option');
                option1.value = model;
                option1.textContent = model;
                singleSelect.appendChild(option1);

                const option2 = document.createElement('option');
                option2.value = model;
                option2.textContent = model;
                batchSelect.appendChild(option2);
            });
        })
        .catch(error => console.error('Error loading models:', error));

        document.getElementById('emailForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailText = document.getElementById('emailText').value;
            const model = document.getElementById('modelSelect').value;
            if (!emailText.trim()) {
                alert('Please enter email text.');
                return;
            }

            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailText, model: model })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    return;
                }
                document.getElementById('prediction').textContent = `Prediction: ${data.prediction}`;
                const confidence = data.confidence * 100;
                document.getElementById('confidenceText').textContent = `Confidence: ${confidence.toFixed(2)}%`;
                const fill = document.getElementById('confidenceFill');
                fill.style.width = `${confidence}%`;
                fill.className = `confidence-fill ${data.prediction === 'Phishing' ? 'phishing' : 'not-phishing'}`;
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').classList.add('fade-in');
            })
            .catch(error => console.error('Error:', error));
        });

        document.getElementById('batchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const batchEmails = document.getElementById('batchEmails').value;
            const model = document.getElementById('batchModelSelect').value;
            if (!batchEmails.trim()) {
                alert('Please enter batch emails.');
                return;
            }
            const emails = batchEmails.split('\n').filter(email => email.trim() !== '');

            fetch('/predict_batch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ emails: emails, model: model })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    return;
                }
                const resultsList = document.getElementById('batchResultsList');
                resultsList.innerHTML = '';
                data.results.forEach((result, index) => {
                    const resultDiv = document.createElement('div');
                    resultDiv.className = `batch-result ${result.prediction === 'Phishing' ? 'batch-phishing' : 'batch-not-phishing'}`;
                    resultDiv.innerHTML = `
                        <strong>Email ${index + 1}:</strong> ${result.prediction}<br>
                        <small>Confidence: ${(result.confidence * 100).toFixed(2)}%</small>
                    `;
                    resultsList.appendChild(resultDiv);
                });
                document.getElementById('batchResults').style.display = 'block';
                document.getElementById('batchResults').classList.add('fade-in');
                // Add export button
                const exportBtn = document.createElement('button');
                exportBtn.className = 'btn btn-success export-btn';
                exportBtn.textContent = 'Export Results as CSV';
                exportBtn.onclick = function() {
                    const csvContent = 'Email,Prediction,Confidence\n' + data.results.map((r, i) => `"${emails[i].replace(/"/g, '""')}",${r.prediction},${(r.confidence * 100).toFixed(2)}%`).join('\n');
                    const blob = new Blob([csvContent], { type: 'text/csv' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'batch_results.csv';
                    a.click();
                    window.URL.revokeObjectURL(url);
                };
                document.getElementById('batchResults').appendChild(exportBtn);
            })
            .catch(error => console.error('Error:', error));
        });

        document.getElementById('loadMetrics').addEventListener('click', function() {
            fetch('/metrics')
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    return;
                }
                document.getElementById('modelName').textContent = data.model_name;
                document.getElementById('accuracy').textContent = (data.accuracy * 100).toFixed(2) + '%';
                document.getElementById('precision').textContent = (data.precision * 100).toFixed(2) + '%';
                document.getElementById('recall').textContent = (data.recall * 100).toFixed(2) + '%';
                document.getElementById('f1').textContent = (data.f1 * 100).toFixed(2) + '%';
                document.getElementById('rocAuc').textContent = (data.roc_auc * 100).toFixed(2) + '%';
                document.getElementById('confusionMatrix').src = '/confusion_matrix';
                document.getElementById('confusionMatrix').style.display = 'block';
                document.getElementById('rocCurve').src = '/roc_curve';
                document.getElementById('rocCurve').style.display = 'block';
                document.getElementById('wordcloudPhishing').src = '/wordcloud_phishing';
                document.getElementById('wordcloudPhishing').style.display = 'block';
                document.getElementById('wordcloudNonPhishing').src = '/wordcloud_non_phishing';
                document.getElementById('wordcloudNonPhishing').style.display = 'block';
                document.getElementById('metrics').style.display = 'block';
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
